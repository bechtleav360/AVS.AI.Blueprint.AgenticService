[pytest]
minversion = 7.0
addopts = -ra -q --strict-markers --ignore=docs/trials
testpaths = tests examples
asyncio_mode = auto
pythonpath =
    src
    examples/trivia_game
    examples/rest_microservice
    examples/simple_event_processor
    examples/complex_agent
markers =
    integration: requires external services (e.g. Redis) — skipped in offline CI
    contract: hits the live network (GitHub API) to check for upstream contract drift — run separately, with GITHUB_TOKEN scoped only to this step (review, PR #95)
