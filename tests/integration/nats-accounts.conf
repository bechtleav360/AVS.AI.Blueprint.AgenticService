# A broker with accounts, for the named-connection tests (tests/integration/test_named_connections.py).
#
# It stands for a deployment whose tenants own their accounts: one account per tenant, provisioned
# by someone else, and an agent user in it that may receive from its deliver subjects and
# acknowledge, nothing else. The process account is allowed nothing at all, so any subscription the
# framework made on an agent's default connection shows up as a permissions violation.
#
# Test-only credentials: every password here is a placeholder, never used anywhere else.

port: 4222
http_port: 8222
jetstream: { store_dir: "/tmp/nats-accounts" }

accounts: {
  PROC: {
    users: [
      { user: proc, password: proc-test-only, permissions: { publish: { deny: [">"] }, subscribe: { deny: [">"] } } }
      # The explicit hybrid mode (nats_unclaimed_subjects = "default_connection") needs a process
      # connection that may receive its own, unclaimed subjects over Core NATS.
      { user: proc-hybrid, password: proc-hybrid-test-only, permissions: { publish: { allow: ["hybrid.>"] }, subscribe: { allow: ["hybrid.>"] } } }
    ]
  }
  TA: {
    jetstream: enabled
    users: [
      { user: admin-a, password: admin-a-test-only }
      { user: agent-a, password: agent-a-test-only, permissions: {
          publish: { allow: ["$JS.ACK.>"] }
          subscribe: { allow: ["acme.agent.A.>"] }
      } }
      # A second agent user of the same account: rotated credentials, for the runtime change test.
      { user: agent-a2, password: agent-a2-test-only, permissions: {
          publish: { allow: ["$JS.ACK.>"] }
          subscribe: { allow: ["acme.agent.A.>"] }
      } }
    ]
  }
  TB: {
    jetstream: enabled
    users: [
      { user: admin-b, password: admin-b-test-only }
      { user: agent-b, password: agent-b-test-only, permissions: {
          publish: { allow: ["$JS.ACK.>"] }
          subscribe: { allow: ["acme.agent.B.>"] }
      } }
    ]
  }
}
