name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - '**'

jobs:
  ci:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-env

      - name: ruff check
        run: ruff check src tests

      - name: ruff format check
        run: ruff format --check src tests

      - name: mypy
        run: mypy src

      - name: Run unit tests
        env:
          # Lets test_session_key_contract.py's live-upstream-drift check reach
          # service-sessions (a private repo); it skips gracefully if this repo's
          # GITHUB_TOKEN doesn't have cross-repo read (org policy, not this token).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pytest tests/unit -v --tb=short
