# The example broker: one account per site, plus the process account. Stands for a deployment
# where each site owns its account and the agent may only receive its deliveries and acknowledge.
#
# No password is written here: every user's password is $EXAMPLE_NATS_PASSWORD, read by the
# server from its environment (see docker-compose.yml). Local example only.

port: 4222
http_port: 8222
jetstream: { store_dir: "/tmp/nats-site-readings" }

accounts: {
  PROC: {
    users: [
      # The agent's default connection. It subscribes nothing (every subject is claimed by a site).
      { user: proc, password: $EXAMPLE_NATS_PASSWORD, permissions: { publish: { deny: [">"] }, subscribe: { deny: [">"] } } }
    ]
  }
  SITE_A: {
    jetstream: enabled
    users: [
      { user: admin-site-a, password: $EXAMPLE_NATS_PASSWORD }
      { user: agent-site-a, password: $EXAMPLE_NATS_PASSWORD, permissions: {
          publish: { allow: ["$JS.ACK.>"] }
          subscribe: { allow: ["deliver.site_a.>"] }
      } }
    ]
  }
  SITE_B: {
    jetstream: enabled
    users: [
      { user: admin-site-b, password: $EXAMPLE_NATS_PASSWORD }
      { user: agent-site-b, password: $EXAMPLE_NATS_PASSWORD, permissions: {
          publish: { allow: ["$JS.ACK.>"] }
          subscribe: { allow: ["deliver.site_b.>"] }
      } }
    ]
  }
}
